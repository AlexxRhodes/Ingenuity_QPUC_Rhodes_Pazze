  stage: build
  tags:
    - debian12-qt6.8
  when: manual
  allow_failure: false
  before_script:
    # Submodule strategy
    - git -c url."https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.ingescape.com/".insteadOf="ssh://git@gitlab.ingescape.com:22222/" submodule update --init --recursive
  script:
    - echo "The next lines force the build to the Qt6.8.2 instead of the default Qt6.2.4 by setting env variables"
    - for l in $(find /home/i2/Qt/6.8.2/gcc_64/lib/cmake -name "Qt6*" -maxdepth 1 -type d | sort); do export `basename $l`_DIR=$l; done
    - export Qt6_QMAKE=/home/i2/Qt/6.8.2/gcc_64/bin/qmake
    - echo "End of specific code to build with Qt6.8.2"
    - cmake . -B build_dir -DCMAKE_BUILD_TYPE=Release -DCI_PIPELINE_ID=${CI_PIPELINE_ID}
    - cmake --build build_dir -- -j2
    - ./bundle-qt6.sh whiteboard 1.0.2 Whiteboard build_dir/apps/Whiteboard/Whiteboard /home/i2/Qt/6.8.2/gcc_64/bin/qmake
    - ./bundle-qt6.sh snapshot 1.0.0 Snapshot build_dir/apps/Snapshot/Snapshot /home/i2/Qt/6.8.2/gcc_64/bin/qmake
  artifacts:
    paths:
      - whiteboard-1.0.2_0-amd64
      - whiteboard-1.0.2_0-amd64.deb
      - snapshot-1.0.0_0-amd64
      - snapshot-1.0.0_0-amd64.deb
  dependencies: []
  needs: []
  
