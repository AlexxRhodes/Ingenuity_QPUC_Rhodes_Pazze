stages:
  - build

workflow:
  rules:
  - if: $CI_PIPELINE_SOURCE == "web"
    when: always
  - when: never

variables:
  VS_CMAKE_GENERATOR: "Visual Studio 17 2022"
  APPLE_SIGNING_ID: "Developer ID Application: Ingenuity i/o (56DRT9MG9S)"

#    ____        _ _     _
#   |  _ \      (_) |   | |
#   | |_) |_   _ _| | __| |
#   |  _ <| | | | | |/ _` |
#   | |_) | |_| | | | (_| |
#   |____/ \__,_|_|_|\__,_|
