build_macos:
  stage: build
  tags:
    - macos-qt6
  when: manual
  allow_failure: false
  before_script:
    # Submodule strategy
    - git -c url."https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.ingescape.com/".insteadOf="ssh://git@gitlab.ingescape.com:22222/" submodule update --init --recursive
  script:
    - echo "The next lines force the build to the Qt6.8.1 instead of the default Qt6.2.4 by setting env variables"
    - echo "When/If we migrate all apps to Qt6.X.Y, the runner will use that version by default and it won't be necessary to force a specific Qt version"
    - for l in $(find /Users/admin/Qt/6.8.1/macos/lib/cmake -maxdepth 1 -name "Qt6*" -type d | sort); do export `basename $l`_DIR=$l; done
    - export Qt6_QMAKE=/Users/admin/Qt/6.8.1/macos/bin/qmake
    - echo "End of specific code to build with Qt6.8.1"
    - cmake . -B build_dir -DCMAKE_PREFIX_PATH="$HOME/builds/sysroot/usr/local/" -DCMAKE_BUILD_TYPE=Release -DCI_PIPELINE_ID=${CI_PIPELINE_ID}
    - cmake --build build_dir -- -j2
  artifacts:
    paths:
      - build_dir/apps/Whiteboard/Whiteboard.app
      - build_dir/apps/Snapshot/Snapshot.app
  dependencies: []
  needs: []


build_win64:
  stage: build
  tags:
    - windows
  when: manual
  allow_failure: false
  before_script:
    # Submodule strategy
    - git -c url."https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.ingescape.com/".insteadOf="ssh://git@gitlab.ingescape.com:22222/" submodule update --init --recursive
  script:
    - $env:PATH += ";$env:DEPLOYMENT_WINDOWS_NET_SHARE\Builds\Release\x64;$env:DEPLOYMENT_WINDOWS_NET_SHARE\Builds"
    - cmake . -B build_dir -G"$env:VS_CMAKE_GENERATOR" -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$env:QT6_8_BASE_DIR" -DCI_PIPELINE_ID="$env:CI_PIPELINE_ID"
    - cmake --build build_dir --target ALL_BUILD --config Release
    - |
       & "$env:DIGICERT_PATH/DigiCertUtil.exe" sign /noInput ./build_dir/apps/Whiteboard/Release/Whiteboard.exe
    - |
       & "$env:DIGICERT_PATH/DigiCertUtil.exe" sign /noInput ./build_dir/apps/Snapshot/Release/Snapshot.exe
  artifacts:
    paths:
      - build_dir/apps/Whiteboard/Release
      - build_dir/apps/Snapshot/Release
  dependencies: []
  needs: []


build_linux:
  stage: build
  tags:
    - ubuntu-18.04
  when: manual
  allow_failure: false
  before_script:
    # Submodule strategy
    - git -c url."https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.ingescape.com/".insteadOf="ssh://git@gitlab.ingescape.com:22222/" submodule update --init --recursive
  script:
    - echo "Building Ingescape Circle"
    - echo "The next lines force the build to the Qt6.8.1 instead of the default Qt6.2.4 by setting env variables"
    - echo "When/If we migrate all apps to Qt6.X.Y, the runner will use that version by default and it won't be necessary to force a specific Qt version"
    - for l in $(find /opt/Qt/6.8.1/gcc_64/lib/cmake -maxdepth 1 -name "Qt6*" -type d | sort); do export `basename $l`_DIR=$l; done
    - export Qt6_QMAKE=/opt/Qt/6.8.1/gcc_64/bin/qmake
    - cmake . -B build_dir -DCMAKE_BUILD_TYPE=Release -DCI_PIPELINE_ID=${CI_PIPELINE_ID}
    - cmake --build build_dir -- -j2
    - ./bundle-qt6.sh whiteboard 1.0.2 Whiteboard build_dir/apps/Whiteboard/Whiteboard /opt/Qt/6.8.1/gcc_64/bin/qmake
    - ./bundle-qt6.sh snapshot 1.0.0 Snapshot build_dir/apps/Snapshot/Snapshot /opt/Qt/6.8.1/gcc_64/bin/qmake
  artifacts:
    paths:
      - whiteboard-1.0.2_0-amd64
      - whiteboard-1.0.2_0-amd64.deb
      - snapshot-1.0.0_0-amd64
      - snapshot-1.0.0_0-amd64.deb
  dependencies: []
  needs: []


